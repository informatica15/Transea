<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TranSea — Speak. It travels.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#051620;
    --deep:#0A2430;
    --tide:#123B49;
    --current:#33C7B4;
    --current-dim:#33C7B433;
    --coral:#FF7A59;
    --coral-dim:#FF7A5933;
    --foam:#EAF7F5;
    --foam-dim:#9FC2C0;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Sora', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html, body{ height:100%; }

  body{
    font-family:var(--font-body);
    color:var(--foam);
    background:var(--abyss);
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    position:relative;
  }

  /* ---------- Ambient depth ---------- */
  .caustics{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(600px 500px at 20% 15%, #114A55aa 0%, transparent 60%),
      radial-gradient(700px 600px at 85% 75%, #0F3A3Faa 0%, transparent 55%),
      radial-gradient(900px 900px at 50% 100%, #051620 0%, var(--abyss) 70%);
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift{
    from{ transform:translateY(0) scale(1); }
    to{ transform:translateY(-18px) scale(1.03); }
  }
  @media (prefers-reduced-motion: reduce){ .caustics{ animation:none; } }

  /* ---------- Layout shell ---------- */
  .app{
    position:relative;
    z-index:1;
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding:22px 20px 28px;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .wordmark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:-0.01em;
    display:flex;
    align-items:baseline;
    gap:2px;
  }
  .wordmark .sea{ color:var(--current); }
  .tagline{
    font-family:var(--font-mono);
    font-size:0.65rem;
    letter-spacing:0.08em;
    color:var(--foam-dim);
    margin-top:2px;
  }

  /* ---------- Language pills ---------- */
  .lang-pills{ display:flex; gap:8px; }
  .pill{
    position:relative;
    background:#ffffff0d;
    border:1px solid #ffffff1a;
    border-radius:999px;
    padding:7px 12px 7px 10px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .pill span.lbl{
    font-family:var(--font-mono);
    font-size:0.6rem;
    color:var(--foam-dim);
    text-transform:uppercase;
    letter-spacing:0.06em;
    position:absolute;
    top:-16px;
    left:10px;
  }
  .pill select{
    appearance:none; -webkit-appearance:none;
    background:transparent;
    border:none;
    color:var(--foam);
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.82rem;
    cursor:pointer;
    padding-right:4px;
  }
  .pill select:focus-visible{ outline:2px solid var(--current); outline-offset:3px; border-radius:6px; }
  .pill select option{ background:var(--deep); color:var(--foam); }

  /* ---------- Stage ---------- */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    padding:20px 0 8px;
    min-height:340px;
  }

  .rings{
    position:relative;
    width:220px; height:220px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    border:1px solid var(--current-dim);
    opacity:0;
  }
  .stage.listening .ring{
    animation: sonar 2.2s ease-out infinite;
  }
  .stage.listening .ring:nth-child(2){ animation-delay:0.6s; }
  .stage.listening .ring:nth-child(3){ animation-delay:1.2s; }
  @keyframes sonar{
    0%{ width:96px; height:96px; opacity:0.7; border-color:var(--current); }
    100%{ width:220px; height:220px; opacity:0; border-color:var(--current-dim); }
  }

  .mic-btn{
    position:relative;
    z-index:2;
    width:96px; height:96px;
    border-radius:50%;
    border:none;
    cursor:pointer;
    background:radial-gradient(circle at 32% 28%, #3FE0CB, var(--current) 60%, #1D8677 100%);
    box-shadow:0 18px 40px -14px #33C7B4aa, inset 0 0 0 1px #ffffff33;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.15s ease, box-shadow 0.2s ease;
  }
  .mic-btn:hover{ transform:scale(1.03); }
  .mic-btn:active{ transform:scale(0.97); }
  .mic-btn:focus-visible{ outline:3px solid var(--foam); outline-offset:5px; }
  .mic-btn svg{ width:34px; height:34px; color:#04211C; }

  .stage.listening .mic-btn{
    background:radial-gradient(circle at 32% 28%, #FF9F85, var(--coral) 60%, #C4522F 100%);
    box-shadow:0 18px 40px -14px #FF7A59aa, inset 0 0 0 1px #ffffff33;
  }

  .stage.translating .mic-btn{ opacity:0.55; pointer-events:none; }

  .waveform{
    display:flex;
    align-items:flex-end;
    gap:3px;
    height:34px;
    opacity:0;
    transition:opacity 0.25s ease;
  }
  .waveform.active{ opacity:1; }
  .waveform i{
    display:block;
    width:3px;
    min-height:4px;
    border-radius:2px;
    background:linear-gradient(180deg, var(--current), var(--coral));
  }

  .hint{
    font-family:var(--font-mono);
    font-size:0.75rem;
    color:var(--foam-dim);
    letter-spacing:0.02em;
    min-height:16px;
    text-align:center;
  }

  /* ---------- Tide divider ---------- */
  .tide-line{ width:100%; height:26px; margin-top:6px; }
  .tide-line path{
    animation: tide-shift 7s linear infinite;
  }
  @keyframes tide-shift{
    from{ transform:translateX(0); }
    to{ transform:translateX(-100px); }
  }
  @media (prefers-reduced-motion: reduce){ .tide-line path{ animation:none; } }

  /* ---------- Result card ---------- */
  .result{
    background:linear-gradient(180deg, #0C2C36, #0A2430);
    border:1px solid #ffffff14;
    border-radius:18px;
    padding:20px 20px 16px;
    display:none;
    flex-direction:column;
    gap:12px;
  }
  .result.show{ display:flex; }

  .said{
    font-family:var(--font-mono);
    font-size:0.78rem;
    color:var(--foam-dim);
    line-height:1.4;
  }
  .said em{ font-style:normal; color:var(--foam); opacity:0.85; }

  .translation-wrap{
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
  }
  .translation-text{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.7rem;
    line-height:1.25;
    color:var(--foam);
    flex:1;
  }
  .expand-hint{
    font-family:var(--font-mono);
    font-size:0.62rem;
    color:var(--current);
    letter-spacing:0.04em;
    margin-top:4px;
  }

  .result-actions{
    display:flex;
    gap:10px;
    padding-top:6px;
    border-top:1px solid #ffffff14;
  }
  .chip-btn{
    display:flex; align-items:center; gap:6px;
    background:#ffffff0d;
    border:1px solid #ffffff1a;
    color:var(--foam);
    font-family:var(--font-mono);
    font-size:0.7rem;
    padding:8px 12px;
    border-radius:999px;
    cursor:pointer;
    transition:background 0.2s, border-color 0.2s;
  }
  .chip-btn:hover{ background:var(--current-dim); border-color:var(--current); }
  .chip-btn:focus-visible{ outline:2px solid var(--current); outline-offset:2px; }
  .chip-btn svg{ width:13px; height:13px; }

  /* ---------- Fullscreen "show to local" mode ---------- */
  .beam{
    position:fixed; inset:0; z-index:50;
    background:var(--abyss);
    display:none;
    align-items:center;
    justify-content:center;
    padding:40px;
    text-align:center;
  }
  .beam.show{ display:flex; }
  .beam-text{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(2rem, 9vw, 3.6rem);
    line-height:1.15;
    color:var(--foam);
  }
  .beam-close{
    position:absolute;
    top:20px; right:20px;
    background:#ffffff14;
    border:1px solid #ffffff26;
    color:var(--foam);
    width:40px; height:40px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .beam-close:focus-visible{ outline:2px solid var(--current); outline-offset:3px; }

  footer{
    text-align:center;
    font-family:var(--font-mono);
    font-size:0.62rem;
    color:var(--foam-dim);
    opacity:0.7;
    margin-top:18px;
    line-height:1.5;
  }

  .unsupported{
    display:none;
    text-align:center;
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:var(--coral);
    max-width:280px;
    margin:0 auto;
  }
</style>
</head>
<body>

<div class="caustics" aria-hidden="true"></div>

<div class="app">

  <header>
    <div>
      <div class="wordmark">Tran<span class="sea">Sea</span></div>
      <div class="tagline">SPEAK. IT TRAVELS.</div>
    </div>
    <div class="lang-pills">
      <div class="pill">
        <span class="lbl">Speaking</span>
        <select id="source-lang" aria-label="Language you speak"></select>
      </div>
      <div class="pill">
        <span class="lbl">Into</span>
        <select id="target-lang" aria-label="Language to translate into"></select>
      </div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="rings" id="rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <button class="mic-btn" id="mic-btn" type="button" aria-label="Tap and speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>

    <div class="waveform" id="waveform"></div>
    <div class="hint" id="hint">Tap and speak</div>
    <div class="unsupported" id="unsupported">Voice input isn't supported in this browser — try Chrome or Edge, and allow microphone access.</div>
  </div>

  <svg class="tide-line" viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 10 Q 12.5 0, 25 10 T 50 10 T 75 10 T 100 10 T 125 10 T 150 10 T 175 10 T 200 10 V20 H0 Z"
          fill="var(--tide)" opacity="0.6"/>
  </svg>

  <div class="result" id="result">
    <div class="said" id="said-line"></div>
    <div class="translation-wrap" id="translation-wrap">
      <div>
        <div class="translation-text" id="translation-text"></div>
        <div class="expand-hint">TAP TO SHOW ON SCREEN</div>
      </div>
    </div>
    <div class="result-actions">
      <button class="chip-btn" id="replay-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        Replay
      </button>
      <button class="chip-btn" id="copy-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
      <button class="chip-btn" id="again-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Speak again
      </button>
    </div>
  </div>

  <footer>Uses your microphone only when you tap the button. Nothing is stored.</footer>
</div>

<div class="beam" id="beam">
  <button class="beam-close" id="beam-close" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <div class="beam-text" id="beam-text"></div>
</div>

<script>
  const LANGUAGES = [
    { code:'en-US', short:'en', flag:'🇬🇧', name:'English' },
    { code:'hi-IN', short:'hi', flag:'🇮🇳', name:'Hindi' },
    { code:'ta-IN', short:'ta', flag:'🇮🇳', name:'Tamil' },
    { code:'fr-FR', short:'fr', flag:'🇫🇷', name:'French' },
    { code:'es-ES', short:'es', flag:'🇪🇸', name:'Spanish' },
    { code:'ja-JP', short:'ja', flag:'🇯🇵', name:'Japanese' },
    { code:'ar-SA', short:'ar', flag:'🇸🇦', name:'Arabic' },
    { code:'de-DE', short:'de', flag:'🇩🇪', name:'German' },
    { code:'zh-CN', short:'zh', flag:'🇨🇳', name:'Mandarin' },
    { code:'ko-KR', short:'ko', flag:'🇰🇷', name:'Korean' },
    { code:'it-IT', short:'it', flag:'🇮🇹', name:'Italian' },
    { code:'pt-PT', short:'pt', flag:'🇵🇹', name:'Portuguese' },
    { code:'ru-RU', short:'ru', flag:'🇷🇺', name:'Russian' },
  ];

  const sourceSel = document.getElementById('source-lang');
  const targetSel = document.getElementById('target-lang');
  const stage = document.getElementById('stage');
  const micBtn = document.getElementById('mic-btn');
  const hint = document.getElementById('hint');
  const unsupported = document.getElementById('unsupported');
  const waveform = document.getElementById('waveform');
  const result = document.getElementById('result');
  const saidLine = document.getElementById('said-line');
  const translationText = document.getElementById('translation-text');
  const translationWrap = document.getElementById('translation-wrap');
  const replayBtn = document.getElementById('replay-btn');
  const copyBtn = document.getElementById('copy-btn');
  const againBtn = document.getElementById('again-btn');
  const beam = document.getElementById('beam');
  const beamText = document.getElementById('beam-text');
  const beamClose = document.getElementById('beam-close');

  LANGUAGES.forEach(l => {
    const o1 = document.createElement('option');
    o1.value = l.code; o1.textContent = `${l.flag} ${l.name}`;
    sourceSel.appendChild(o1);
    const o2 = document.createElement('option');
    o2.value = l.code; o2.textContent = `${l.flag} ${l.name}`;
    targetSel.appendChild(o2);
  });
  sourceSel.value = 'en-US';
  targetSel.value = 'ta-IN';

  // ---------- Waveform bars ----------
  const BAR_COUNT = 28;
  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement('i');
    bar.style.height = '4px';
    waveform.appendChild(bar);
  }
  const bars = waveform.querySelectorAll('i');

  let audioCtx, analyser, micStream, rafId;

  function startWaveform(stream) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 64;
    src.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);

    function draw() {
      analyser.getByteFrequencyData(data);
      bars.forEach((bar, i) => {
        const v = data[i % data.length] || 0;
        bar.style.height = Math.max(4, (v / 255) * 34) + 'px';
      });
      rafId = requestAnimationFrame(draw);
    }
    draw();
    waveform.classList.add('active');
  }

  function stopWaveform() {
    if (rafId) cancelAnimationFrame(rafId);
    if (audioCtx) audioCtx.close();
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    waveform.classList.remove('active');
    bars.forEach(b => b.style.height = '4px');
  }

  // ---------- Speech recognition ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let listening = false;

  if (!SpeechRecognition) {
    unsupported.style.display = 'block';
    hint.style.display = 'none';
    micBtn.disabled = true;
    micBtn.style.opacity = 0.4;
    micBtn.style.cursor = 'not-allowed';
  }

  function buildRecognition() {
    const rec = new SpeechRecognition();
    rec.lang = sourceSel.value;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = (e) => {
      let transcript = '';
      for (let i = 0; i < e.results.length; i++) transcript += e.results[i][0].transcript;
      saidLine.innerHTML = `You said <em>${transcript}</em>`;
      result.classList.add('show');
      if (e.results[e.results.length - 1].isFinal) {
        finishTranslation(transcript.trim());
      }
    };

    rec.onerror = () => {
      hint.textContent = 'Could not hear you — tap to try again';
      endListening();
    };

    rec.onend = () => {
      if (listening) endListening();
    };

    return rec;
  }

  async function startListening() {
    if (!SpeechRecognition) return;
    result.classList.remove('show');
    listening = true;
    stage.classList.add('listening');
    stage.classList.remove('translating');
    hint.textContent = 'Listening…';

    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      startWaveform(micStream);
    } catch (e) {
      hint.textContent = 'Microphone access is blocked — check permissions';
    }

    recognition = buildRecognition();
    recognition.start();
  }

  function endListening() {
    listening = false;
    stage.classList.remove('listening');
    stopWaveform();
    if (recognition) { try { recognition.stop(); } catch (e) {} }
  }

  async function finishTranslation(text) {
    endListening();
    if (!text) { hint.textContent = 'Tap and speak'; return; }
    stage.classList.add('translating');
    hint.textContent = 'Translating…';

    try {
      const res = await fetch('/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: text,
          source: sourceSel.value,
          target: targetSel.value
        })
      });
      const data = await res.json().catch(() => ({}));

      if (!res.ok || data.error) {
        throw new Error(data.error || `Translation request failed (${res.status})`);
      }

      translationText.textContent = data.translated_text;
      hint.textContent = 'Tap and speak';
      stage.classList.remove('translating');
      speakTranslation(data.translated_text);
    } catch (err) {
      console.error('Translation error:', err);
      hint.textContent = err.message || 'Translation failed — check your connection';
      stage.classList.remove('translating');
    }
  }

  let currentAudio = null;

  async function speakTranslation(text) {
    if (!text) return;

    if (currentAudio) { currentAudio.pause(); currentAudio = null; }

    try {
      const res = await fetch('/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text, lang: targetSel.value })
      });
      if (!res.ok) throw new Error('speak endpoint failed');

      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      currentAudio = new Audio(url);
      currentAudio.play();
    } catch (err) {
      // Fall back to the browser's built-in voice if the server call fails
      // (e.g. offline). Coverage for non-Latin languages may be limited.
      if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = targetSel.value;
        speechSynthesis.cancel();
        speechSynthesis.speak(utter);
      }
    }
  }

  micBtn.addEventListener('click', () => {
    if (listening) { endListening(); hint.textContent = 'Tap and speak'; return; }
    startListening();
  });

  againBtn.addEventListener('click', startListening);

  replayBtn.addEventListener('click', () => speakTranslation(translationText.textContent));

  copyBtn.addEventListener('click', async () => {
    const t = translationText.textContent;
    if (!t) return;
    try {
      await navigator.clipboard.writeText(t);
      const original = copyBtn.innerHTML;
      copyBtn.textContent = 'Copied';
      setTimeout(() => { copyBtn.innerHTML = original; }, 1300);
    } catch (e) {}
  });

  translationWrap.addEventListener('click', () => {
    if (!translationText.textContent) return;
    beamText.textContent = translationText.textContent;
    beam.classList.add('show');
  });
  beamClose.addEventListener('click', () => beam.classList.remove('show'));
  beam.addEventListener('click', (e) => { if (e.target === beam) beam.classList.remove('show'); });
</script>

</body>
</html>
